app:
  name: ResearchFlow-Agent
  environment: development
  log_level: INFO

database:
  path: data/researchflow.db

qdrant:
  mode: http
  url: http://localhost:6333
  collection_name: papers_text
  figures_collection_name: paper_figures_text
  figures_image_collection_name: paper_figures_image

models:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_local_files_only: true
  image_embedding_model: ViT-B-32
  image_embedding_pretrained: laion2b_s34b_b79k
  llm_model: gpt-4.1-mini

llm:
  provider: mock
  base_url:
  api_key:

storage:
  data_dir: data
  upload_dir: data/uploads

organizer:
  library_root: data/library
  default_mode: copy
  folder_template: "{primary_topic}/{year}"
  unknown_year: unknown_year
  safe_filename_max_length: 120
  auto_organize_after_ingest: false

api:
  host: 127.0.0.1
  port: 8000
