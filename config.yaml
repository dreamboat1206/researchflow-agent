app:
  name: ResearchFlow-Agent
  environment: development
  log_level: INFO

database:
  path: data/researchflow.db

qdrant:
  mode: http
  url: http://localhost:6333
  collection_name: papers_text
  figures_collection_name: paper_figures_text

models:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_local_files_only: true
  llm_model: gpt-4.1-mini

llm:
  provider: mock
  base_url:
  api_key:

storage:
  data_dir: data
  upload_dir: data/uploads

api:
  host: 127.0.0.1
  port: 8000
