services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build: .
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/researchflow.db
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: papers_text
      QDRANT_FIGURES_COLLECTION: paper_figures_text
      QDRANT_FIGURES_IMAGE_COLLECTION: paper_figures_image
      EMBEDDING_LOCAL_FILES_ONLY: "true"
      LLM_PROVIDER: mock
      NO_PROXY: localhost,127.0.0.1,qdrant
      no_proxy: localhost,127.0.0.1,qdrant
    volumes:
      - .:/app
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface:ro
    depends_on:
      - qdrant

  streamlit:
    build: .
    command: streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      API_HOST: api
      API_PORT: "8000"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: papers_text
      QDRANT_FIGURES_COLLECTION: paper_figures_text
      QDRANT_FIGURES_IMAGE_COLLECTION: paper_figures_image
      NO_PROXY: localhost,127.0.0.1,api,qdrant
      no_proxy: localhost,127.0.0.1,api,qdrant
    volumes:
      - .:/app
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface:ro
    depends_on:
      - api
      - qdrant

volumes:
  qdrant_storage:
